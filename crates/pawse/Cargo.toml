[package]
name = "pawse"
version.workspace = true
edition.workspace = true
publish = false
authors = ["Aleksandr Popov <popov.psk@gmail.com>"]
description = "A fast, native music player for your local library"
homepage = "https://github.com/popovpsk/pawse"
license = "MIT"

[[bin]]
name = "pawse"
path = "src/main.rs"

[features]
default = ["self-update"]
self-update = ["updater/self-update"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
audio_engine = { path = "../audio_engine" }
audio_output = { path = "../audio_output" }
music_library = { path = "../music_library" }
music_indexer = { path = "../music_indexer" }
tag_writer = { path = "../tag_writer" }
pawse_remote = { path = "../pawse_remote" }
lyrics = { path = "../lyrics" }
diagnostics = { workspace = true }
log = { workspace = true }
rfd = "0.17"
flume = "0.12.0"
notify = "8"
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ui_components = { path = "../ui_components" }
ui_resources = { path = "../ui_resources" }
media_integration = { path = "../media_integration" }
subsonic = { path = "../subsonic" }
jellyfin = { path = "../jellyfin" }
server_http = { path = "../server_http" }
media_stream = { path = "../media_stream" }
torrent = { path = "../torrent" }
scrobble = { path = "../scrobble" }
discord = { path = "../discord" }
updater = { path = "../updater", default-features = false }
sys-locale = "0.3"
nucleo-matcher = "0.3"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
interprocess = "2"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "Pawse"
identifier = "dev.pawse.app"
category = "Music"
long-description = """
Pawse is a native music player for a local library: it indexes your folders, \
browses by artist, album and playlist, and plays gapless with bit-perfect output \
where the platform allows it. It also scrobbles to Last.fm, reports to Discord, \
and serves a web remote on the local network.
"""
icons = [
    "../ui_resources/assets/app-icon/32x32.png",
    "../ui_resources/assets/app-icon/128x128.png",
    "../ui_resources/assets/app-icon/256x256.png",
    "../ui_resources/assets/app-icon/icon.icns",
    "../ui_resources/assets/app-icon/icon.ico",
]

[package.metadata.packager.pacman]
depends = [
    "alsa-lib",
    "dbus",
    "fontconfig",
    "hicolor-icon-theme",
    "libxcb",
    "libxkbcommon",
    "libxkbcommon-x11",
    "vulkan-icd-loader",
    "wayland",
]

[package.metadata.packager.pacman.files]
"../../LICENSE" = "/usr/share/licenses/pawse-bin/LICENSE"

[package.metadata.packager.deb]
section = "sound"
depends = [
    "libasound2",
    "libdbus-1-3",
    "libvulkan1",
    "libwayland-client0",
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "fontconfig-config",
    "hicolor-icon-theme",
]

[package.metadata.packager.deb.files]
"../../LICENSE" = "/usr/share/doc/pawse/copyright"

[package.metadata.packager.macos]
minimum-system-version = "10.15"
info-plist-path = "Info.plist"

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
torrent = { path = "../torrent", features = ["test-support"] }
