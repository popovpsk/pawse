[package]
name = "media_integration"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
flume = "0.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-media-player = "0.3.2"
objc2-core-foundation = "0.3.2"
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = "0.8"
log = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.18", default-features = false, features = ["async-io"] }
futures-lite = { version = "2.6", default-features = false, features = ["std"] }
log = { workspace = true }

[dev-dependencies]
rstest = "0.26"

[lints.rust]
unsafe_code = "allow"
